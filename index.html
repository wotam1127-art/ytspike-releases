<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>YTspike 받기</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1016;
    --surface: #151a23;
    --border: #252c3a;
    --text: #e6eaf0;
    --dim: #98a3b2;
    --faint: #6a7482;
    --accent: #e0383e;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Malgun Gothic', -apple-system, system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 26px;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p.lead { margin: 0 0 22px; font-size: 13.5px; color: var(--dim); line-height: 1.65; }
  label { display: block; font-size: 12px; color: var(--faint); margin-bottom: 7px; }
  input {
    width: 100%;
    padding: 14px 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-family: Consolas, monospace;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,56,62,.22); }
  button {
    width: 100%;
    margin-top: 12px;
    height: 44px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; line-height: 1.6; }
  .msg.bad { color: var(--accent); }
  .done { margin-top: 18px; padding: 16px; border: 1px solid var(--ok); border-radius: 10px; }
  .done a {
    display: block;
    margin-top: 10px;
    padding: 12px;
    text-align: center;
    background: var(--ok);
    color: #06220c;
    font-weight: 700;
    border-radius: 8px;
    text-decoration: none;
  }
  .note { margin-top: 20px; font-size: 11.5px; color: var(--faint); line-height: 1.7; }
  @media (max-width: 480px) { input { font-size: 24px; } }
</style>
</head>
<body>
<div class="card">
  <h1>YTspike 받기</h1>
  <p class="lead">신청하실 때 정하신 <strong>숫자 6자리</strong>를 넣어 주세요.</p>

  <label for="code">번호 6자리</label>
  <input id="code" inputmode="numeric" autocomplete="off" placeholder="——————" autofocus />
  <button id="go" disabled>확인</button>

  <div id="msg" class="msg"></div>

  <p class="note">
    이 번호는 프로그램을 처음 켤 때도 그대로 씁니다. 잊지 않도록 메모해 두세요.<br />
    번호가 기억나지 않으시면 신청하신 메일로 문의해 주세요.
  </p>
</div>

const el = (id) => document.getElementById(id);
const bin = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

el("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
  el("go").disabled = e.target.value.length !== 6;
  el("msg").textContent = "";
});
el("code").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !el("go").disabled) check();
});
el("go").addEventListener("click", check);

async function check() {
  const code = el("code").value;
  el("go").disabled = true;
  el("msg").className = "msg";
  // 일부러 느리게 도는 구간이라 먼저 알려 준다
  el("msg").textContent = "확인하는 중…";

  try {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bin(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );

    for (const blob of BLOBS) {
      const [iv, ct] = blob.split(".");
      try {
        const out = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: bin(iv) }, key, bin(ct)
        );
        return show(new TextDecoder().decode(out));
      } catch (_) {
        // 이 번호의 것이 아니면 그냥 다음 것을 본다
      }
    }

    el("msg").className = "msg bad";
    el("msg").textContent = "등록되지 않은 번호입니다. 신청하실 때 적으신 숫자가 맞는지 확인해 주세요.";
  } catch (err) {
    el("msg").className = "msg bad";
    el("msg").textContent = "확인에 실패했습니다. 새로고침 후 다시 시도해 주세요.";
  } finally {
    el("go").disabled = el("code").value.length !== 6;
  }
}

function show(url) {
  el("msg").className = "msg";
  el("msg").innerHTML =
    '<div class="done">확인되었습니다. 아래에서 받으세요.' +
    '<a href="' + url.replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">다운로드</a>' +
    "</div>";
  el("go").style.display = "none";
  el("code").disabled = true;
}
</script>
